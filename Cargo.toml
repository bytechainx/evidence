[package]
name = "evidence"
version = "0.1.2"
edition = "2021"
rust-version = "1.71"
description = "审计证据追加面：领域无关的结构化 provenance、幂等 receipt 绑定与本地 durable 文件存储"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bytechainx/evidence"
homepage = "https://github.com/bytechainx/evidence"
documentation = "https://github.com/bytechainx/evidence#readme"
readme = "README.md"
keywords = ["audit", "evidence", "provenance", "persistence", "sha256"]
categories = ["filesystem", "cryptography"]
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "examples/**/*",
    "docs/**/*",
    "README.md",
    "CHANGELOG.md",
    "CONTEXT.md",
    "CONTRIBUTING.md",
    "LICENSE-*",
    "Cargo.toml",
]

[dependencies]
async-trait = "0.1"
sha2 = "0.10"
thiserror = "2"

[features]
# 非默认 feature：启用 TestSigningKey 与依赖它的 sign/verify API。
# 仅测试与开发场景使用；生产构建不应启用此 feature。
test-signing-key = []

[dev-dependencies]
tempfile = "3"
# 本仓自身的集成测试（tests/tdd_contracts.rs、aidd_boundary.rs、query_sign.rs、sdd_spec.rs）
# 需要 `TestSigningKey` 与 `ImmutableBinding::sign`，而二者按
# `cfg(any(test, feature = "test-signing-key"))` 门控——集成测试目标下 lib 不带 `cfg(test)`，
# 故用「自 dev-dependency」在这些测试目标上启用 `test-signing-key`。
# dev-dependencies 不参与 `cargo build` / 发布产物，生产侧的防泄露门控意图不变。
#
# `version-consistency` 检查器已明确**自引用不算跨仓声明**（`scripts/check-version-consistency.mjs`
# 「自引用不算跨仓声明」段；`specs/features/001-*/data-model.md` V6–V10 注），缺 `version` 不报
# `cross_repo_req`；而 `version` 在打包时强制去注册表解析，本仓不发布 crates.io，必致
# `cargo package` 失败。故自引用**不带 `version`**（只留 `path` + `features`），检查器与打包两边均满足。
evidence = { path = ".", features = ["test-signing-key"] }

# benches/hot_path.rs 自带 fn main()，必须关掉 libtest harness 才会真正执行。
[[bench]]
name = "hot_path"
harness = false

[lints.rust]
private_interfaces = "deny"
private_bounds = "deny"
unused_must_use = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[package.metadata.bytechainx]
module_id = "evidence"
owner = "bytechainx"
role = "infra"
semantic_contract = "docs/标准.md"
